{% extends 'base.html' %}{% block body %}<h3>Find Doctors</h3><form class="mb-3 d-flex gap-2"><input class="form-control" name="q" value="{{ q }}" placeholder="Name or specialization"><button class="btn btn-primary">Search</button></form>
<div class="row g-3">{% for d in doctors %}<div class="col-md-4"><div class="card p-3"><h5>Dr. {{ d.user.name }}</h5><div class="text-primary">{{ d.specialization }}</div><small>{{ d.experience_years }} yrs experience</small>
<form method="post" action="{{ url_for('appointments.book', did=d.id) }}" class="mt-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-2" type="datetime-local" name="when" required><input class="form-control mb-2" name="reason" placeholder="Reason"><button class="btn btn-primary btn-sm">Book</button></form></div></div>{% else %}<p>No doctors found.</p>{% endfor %}</div>{% endblock %}
