{% extends 'base.html' %}{% block body %}<div class="card p-4 mx-auto" style="max-width:420px"><h4 class="text-primary">Login</h4>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
<input class="form-control mb-3" name="password" type="password" placeholder="Password" required><button class="btn btn-primary w-100">Login</button></form>
<a class="mt-3" href="{{ url_for('auth.register') }}">Create account</a></div>{% endblock %}
