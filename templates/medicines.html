{% extends 'base.html' %}{% block body %}<h3>Medicine Reminders</h3><div class="card p-3 mb-3"><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-3"><input class="form-control" name="name" placeholder="Medicine" required></div><div class="col-md-2"><input class="form-control" name="dosage" placeholder="Dosage" required></div>
<div class="col-md-2"><input class="form-control" type="date" name="start" required></div><div class="col-md-2"><input class="form-control" type="date" name="end" required></div>
<div class="col-md-2"><input class="form-control" type="time" name="time" required></div><div class="col-md-1"><button class="btn btn-primary">Add</button></div></form></div>
<div id="due"></div><div class="card p-3"><table class="table"><tr><th>Medicine</th><th>Dosage</th><th>From</th><th>To</th><th>Time</th><th></th></tr>
{% for m in meds %}<tr data-t="{{ m.reminder_time }}" data-a="{{ 1 if m.start_date<=today<=m.end_date else 0 }}" data-n="{{ m.name }}"><td>{{ m.name }}</td><td>{{ m.dosage }}</td><td>{{ m.start_date }}</td><td>{{ m.end_date }}</td><td>{{ m.reminder_time }}</td>
<td><form method="post" action="{{ url_for('patient.del_med', mid=m.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
{% block scripts %}<script>const shown=new Set();function chk(){const n=new Date().toTimeString().slice(0,5);document.querySelectorAll('tr[data-t]').forEach(r=>{if(r.dataset.a=='1'&&r.dataset.t==n&&!shown.has(r.dataset.n+n)){shown.add(r.dataset.n+n);due.innerHTML+='<div class="alert alert-info">Time to take '+r.dataset.n+'</div>';if(window.Notification&&Notification.permission=='granted')new Notification('Take '+r.dataset.n)}})}
if(window.Notification&&Notification.permission=='default')Notification.requestPermission();setInterval(chk,15000);chk()</script>{% endblock %}
